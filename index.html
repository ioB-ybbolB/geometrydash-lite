<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Lite v2.3</title>
    <link rel="icon" href="lite_favicon.png">
    <style>
        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #444; }
        #gameContainer { width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
        .logo { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 10; object-fit: cover; object-position: bottom; }
        .progress { margin: 1.5em; width: 420px; height: 32px; display: none; position: absolute; z-index: 100; background-image: url(./slider.png); bottom: 85px; background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 35px; overflow: hidden; }
        .progress .full { height: 16px; background-image: url(./sliderBar.png); background-repeat-y: no-repeat; top: 50%; }
        #loader { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: black; }
        .spinner { margin: 10px; font-size: 10px; position: relative; text-indent: -9999em; border-top: 1.1em solid rgba(255, 255, 255, 0.2); border-right: 1.1em solid rgba(255, 255, 255, 0.2); border-bottom: 1.1em solid rgba(255, 255, 255, 0.2); border-left: 1.1em solid #ffffff; transform: translateZ(0); animation: spinner-spin 1.1s infinite linear; }
        @keyframes spinner-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="gameContainer"></div>
<div id="loader">
    <img class="logo" src="loading.png?v=1">
    <div class="spinner" id="initial-spinner"></div>
    <div class="progress">
        <div class="progress_child">
            <div class="full"></div>
        </div>
    </div>
</div>

<script src="build/UnityLoader.js"></script>
<script>
    const CHUNK_COUNT = 4;
    const CHUNK_BASE_NAME = "build/geo.data.unityweb.part";

    async function loadAndMergeChunks() {
        const loader = document.querySelector("#loader");
        const progressBar = document.querySelector(".progress");
        const progressFull = document.querySelector(".full");
        
        progressBar.style.display = "block";
        document.getElementById("initial-spinner").style.display = "none";

        const chunks = [];
        
        try {
            for (let i = 1; i <= CHUNK_COUNT; i++) {
                const response = await fetch(`${CHUNK_BASE_NAME}${i}`);
                if (!response.ok) throw new Error(`Failed to load chunk ${i}`);
                
                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length');
                
                let receivedLength = 0;
                let chunkData = new Uint8Array(contentLength);
                
                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunkData.set(value, receivedLength);
                    receivedLength += value.length;
                    
                    // Update progress bar (0 to 50% for downloading)
                    let chunkProgress = (i - 1) / CHUNK_COUNT + (receivedLength / contentLength) / CHUNK_COUNT;
                    progressFull.style.width = `${chunkProgress * 50}%`; 
                }
                chunks.push(chunkData);
            }

            const mergedBlob = new Blob(chunks, { type: "application/octet-stream" });
            const blobUrl = URL.createObjectURL(mergedBlob);
            
            initUnity(blobUrl);
            
        } catch (err) {
            console.error("Chunk loading failed:", err);
            alert("Failed to load game data chunks.");
        }
    }

    function initUnity(dataUrl) {
        UnityLoader.compatibilityCheck = function (e, t, r) { t(); };
        
        var gameInstance = UnityLoader.instantiate("gameContainer", "build/geo.json", {
            onProgress: UnityProgress,
            dataUrl: dataUrl 
        });
    }

    var alertShown = false;
    function UnityProgress(gameInstance, progress) {
        const loader = document.querySelector("#loader");
        let percent_progress = 50 + (progress * 50);

        if (!gameInstance.progress) {
            gameInstance.progress = document.querySelector(".full");
        }

        gameInstance.progress.style.width = `${percent_progress}%`;

        if (percent_progress >= 85 && !alertShown) {
            alert("Start spamming ESC until the game loads to bypass the redirection");
            alertShown = true;
        }

        if (progress === 1 && !gameInstance.removeTimeout) {
            gameInstance.removeTimeout = setTimeout(function () {
                loader.style.display = "none";
            }, 2000);
        }
    }

    loadAndMergeChunks();
</script>
</body>
</html>
